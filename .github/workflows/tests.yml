name: 🧪 Tests
on:
  workflow_call:
jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Check out repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Turbo
        uses: ./.github/actions/setup-turbo
      - name: 📦 Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: ⚡ Run Unit Tests with coverage
        run: yarn test:coverage
      # always() so a run that fails the coverage threshold still publishes the
      # report explaining which files fell short. Vitest writes its reporters
      # before exiting non-zero on a threshold breach, so the data is there.
      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
      - name: 🔍 Check spell CSV / generated file are in sync
        run: yarn turbo generate:spells:check --filter=@ageorgedev/dnd-character-sheet
